spring:
  application:
    name: telegram-referral-bot
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:telegram_bot_db}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DB_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate: WARN

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    # Use "webhook" or "polling"
    mode: polling
    
  adminBot:
    token: ${TELEGRAM_ADMIN_BOT_TOKEN}
    username: ${TELEGRAM_ADMIN_BOT_USERNAME}
    mode: polling
    
  webhook:
    url: ${TELEGRAM_WEBHOOK_URL:https://yourdomain.com}
    path: /webhook

bot:
  admin:
    chatIds: ${ADMIN_CHAT_IDS:698738577,657778959}
  images:
    basePath: ${BOT_IMAGES_BASE_PATH:}
  inviteLink:
    expireHours: ${INVITE_LINK_EXPIRE_HOURS:24}
    memberLimit: ${INVITE_LINK_MEMBER_LIMIT:1}

server:
  port: ${PORT:8080}
